name: Check and deploy game
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
env:
  BASE_PATH: /Drink-at-Ron/
  VITE_RELEASE_ID: ${{ github.sha }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e -- --project=chromium
      - run: npm run test:e2e -- --project=webkit
      - run: npm run test:update
      - run: npm run test:workshop -- --project=chromium
        env:
          BASE_PATH: /
      - run: npm run test:workshop -- --project=webkit
        env:
          BASE_PATH: /
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-failures
          path: test-results/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
